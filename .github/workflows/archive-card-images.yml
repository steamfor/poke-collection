name: Archive Japanese card scans
on:
  push:
    branches: [feature/local-card-images]
    paths:
      - 'scripts/download-card-images.cjs'
      - '.github/workflows/archive-card-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download scans
        run: node scripts/download-card-images.cjs
      - name: Commit scans to this branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/cards/
          if ! git diff --cached --quiet; then
            git commit -m "Archive downloaded Japanese card images"
            git push
          fi

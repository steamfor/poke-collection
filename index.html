<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PokeCollection — JP Edition</title>
  <link rel="icon" id="favicon" type="image/png" href="" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1a1a2e" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ============================================================
       STICKY NAV (header + set tabs)
  ============================================================ -->
  <div class="sticky-nav">

  <!-- ============================================================
       HEADER
  ============================================================ -->
  <header class="header">
    <div class="header__logo">
      <img
        class="header__pokeball"
        src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png"
        alt="Poké Ball"
        width="38"
        height="38"
      />
      <span class="header__logo-text">
        PokeCollection
        <small id="header-subtitle">TRACKER — EDITION JAPONAISE</small>
      </span>
    </div>

    <div class="header__right">
      <!-- Language selector -->
      <div class="lang-switch">
        <button class="lang-switch__btn" data-lang="jp" onclick="setLanguage('jp')">JP</button>
        <button class="lang-switch__btn lang-switch__btn--active" data-lang="fr" onclick="setLanguage('fr')">FR</button>
        <button class="lang-switch__btn" data-lang="en" onclick="setLanguage('en')">EN</button>
      </div>

      <!-- Global stats -->
      <div class="stats">
        <div class="stats__item">
          <span class="stats__value" id="stat-owned">0</span>
          <span class="stats__label" id="stat-owned-lbl">POSSEDEES</span>
        </div>
        <div class="stats__item">
          <span class="stats__value" id="stat-total">0</span>
          <span class="stats__label" id="stat-total-lbl">TOTAL</span>
        </div>
        <div class="stats__item">
          <span class="stats__value" id="stat-pct" style="color: var(--green)">0%</span>
          <span class="stats__label" id="stat-pct-lbl">COMPLET</span>
        </div>
      </div>
    </div>
  </header>

  <!-- ============================================================
       SET NAVIGATION
  ============================================================ -->
  <nav class="set-nav">
    <button class="set-nav__tab set-nav__tab--active" data-set="base"   onclick="selectSet('base')">
      <span class="set-nav__dot" style="background:#e53935"></span><span id="tab-base">SET DE BASE</span>
    </button>
    <button class="set-nav__tab" data-set="jungle" onclick="selectSet('jungle')">
      <span class="set-nav__dot" style="background:#43a047"></span><span id="tab-jungle">JUNGLE</span>
    </button>
    <button class="set-nav__tab" data-set="fossil" onclick="selectSet('fossil')">
      <span class="set-nav__dot" style="background:#c89020"></span><span id="tab-fossil">FOSSIL</span>
    </button>
    <button class="set-nav__tab" data-set="rocket" onclick="selectSet('rocket')">
      <span class="set-nav__dot" style="background:#7986cb"></span><span id="tab-rocket">ROCKET</span>
    </button>
    <button class="set-nav__tab" data-set="extras" onclick="selectSet('extras')">
      <span class="set-nav__dot" style="background:#ff9800"></span><span id="tab-extras">EXTRAS</span>
    </button>
  </nav>

  </div><!-- end .sticky-nav -->

  <!-- ============================================================
       TOOLBAR
  ============================================================ -->
  <div class="toolbar">
    <button class="toolbar__btn toolbar__btn--export" onclick="exportCollection()">💾 <span id="btn-export">EXPORTER</span></button>
    <button class="toolbar__btn toolbar__btn--import" onclick="document.getElementById('import-input').click()">📂 <span id="btn-import">IMPORTER</span></button>
    <button class="toolbar__btn toolbar__btn--reset"  onclick="confirmReset()">🗑 <span id="btn-reset">RESET</span></button>
    <button class="toolbar__btn toolbar__btn--showcase" id="btn-showcase-toggle" onclick="toggleShowcase()">✨ <span id="btn-showcase">SHOWCASE</span></button>
    <input type="file" id="import-input" accept=".json" style="display:none" onchange="importCollection(event)" />
    <span class="toolbar__hint">← sauvegarde / restaure ta collection</span>
  </div>

  <!-- ============================================================
       FILTER BAR
  ============================================================ -->
  <div class="filter-bar">
    <div class="filter-bar__search-wrap">
      <input
        type="text"
        id="search-input"
        class="filter-bar__search"
        placeholder="🔍 Rechercher..."
        oninput="applyFilters(); toggleClearBtn()"
      />
      <button class="filter-bar__clear" id="search-clear" onclick="clearSearch()" style="display:none">✕</button>
    </div>
    <button class="filter-bar__btn filter-bar__btn--active" id="filter-all"     onclick="setFilter('all')">TOUTES</button>
    <button class="filter-bar__btn"                         id="filter-owned"   onclick="setFilter('owned')">POSSEDEES</button>
    <button class="filter-bar__btn"                         id="filter-missing" onclick="setFilter('missing')">MANQUANTES</button>

    <div class="progress">
      <div class="progress__labels">
        <span id="progress-text">0 / 0</span>
        <span class="progress__pct" id="progress-pct">0%</span>
      </div>
      <div class="progress__bar">
        <div class="progress__fill" id="progress-fill" style="width: 0%"></div>
      </div>
    </div>
  </div>

  <!-- ============================================================
       CARDS
  ============================================================ -->
  <main class="main" id="cards-container"></main>

  <!-- Toast notification -->
  <div class="toast" id="toast"></div>

  <!-- Footer -->
  <footer class="footer">
    <div>Made with <span class="footer__heart">♥</span> by Steamfor — 2026</div>
    <div>PokeCollection is not affiliated with Nintendo / Game Freak / The Pokemon Company</div>
    <div>Sprites by <a href="https://pokeapi.co" target="_blank">PokeAPI</a></div>
  </footer>


  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <!-- Confetti canvas -->
  <canvas id="confetti-canvas" style="position:fixed;inset:0;pointer-events:none;z-index:999;display:none;"></canvas>

</body>
</html>

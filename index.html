<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PokeCollection — JP Edition</title>
  <link rel="icon" id="favicon" type="image/png" href="" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1a1a2e" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    /* ============================================================
       VARIABLES & RESET
    ============================================================ */
    :root {
      --bg:          #0d0d1a;
      --bg-card:     #1c1836;
      --bg-card-own: #122b22;
      --red:         #cc0000;
      --gold:        #f5c518;
      --green:       #00e89a;
      --blue:        #4a9eff;
      --purple:      #c8a0ff;
      --text:        #e8e8e8;
      --muted:       #555;
      --border:      rgba(255,255,255,0.07);
      --font-pixel:  'Press Start 2P', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: sans-serif;
      min-height: 100vh;
      /* Subtle background grid */
      background-image:
        repeating-linear-gradient(0deg,   transparent, transparent 40px, rgba(255,255,255,0.012) 40px, rgba(255,255,255,0.012) 41px),
        repeating-linear-gradient(90deg,  transparent, transparent 40px, rgba(255,255,255,0.012) 40px, rgba(255,255,255,0.012) 41px);
    }

    /* ============================================================
       HEADER
    ============================================================ */
    .header {
      background: linear-gradient(180deg, #1a0505, var(--bg));
      border-bottom: 3px solid var(--red);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 99;
      box-shadow: 0 4px 30px rgba(204,0,0,0.3);
    }

    .header__logo {
      font-family: var(--font-pixel);
      font-size: 11px;
      color: var(--gold);
      text-shadow: 0 0 20px rgba(245,197,24,0.4);
      line-height: 1.8;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header__logo-text {
      display: flex;
      flex-direction: column;
    }

    .header__pokeball {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      filter: drop-shadow(0 0 6px rgba(229,57,53,0.5));
      animation: pokeball-spin 8s linear infinite;
    }

    @keyframes pokeball-spin {
      0%   { transform: rotate(0deg); }
      90%  { transform: rotate(0deg); }
      95%  { transform: rotate(20deg); }
      100% { transform: rotate(0deg); }
    }

    .header__logo small {
      display: block;
      font-size: 6px;
      color: #ff5555;
      letter-spacing: 1.5px;
      margin-top: 2px;
    }

    .header__right {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    /* ============================================================
       GLOBAL STATS
    ============================================================ */
    .stats {
      display: flex;
      gap: 10px;
    }

    .stats__item {
      text-align: center;
      padding: 7px 14px;
      border: 1px solid rgba(245,197,24,0.2);
      background: rgba(245,197,24,0.04);
      border-radius: 4px;
      font-family: var(--font-pixel);
    }

    .stats__value {
      display: block;
      font-size: 14px;
      color: var(--gold);
      margin-bottom: 4px;
    }

    .stats__label {
      font-size: 5px;
      color: var(--muted);
      letter-spacing: 1px;
    }

    /* ============================================================
       LANGUAGE SWITCHER
    ============================================================ */
    .lang-switch {
      display: flex;
      gap: 4px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      overflow: hidden;
      background: rgba(0,0,0,0.3);
    }

    .lang-switch__btn {
      font-family: var(--font-pixel);
      font-size: 7px;
      padding: 8px 11px;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      transition: 0.2s;
    }

    .lang-switch__btn:hover { color: #aaa; background: rgba(255,255,255,0.04); }
    .lang-switch__btn--active { color: var(--bg) !important; background: var(--gold) !important; }

    /* ============================================================
       SET TABS NAV
    ============================================================ */
    .set-nav {
      background: rgba(0,0,0,0.4);
      display: flex;
      padding: 0 32px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      overflow-x: auto;
    }

    .set-nav__tab {
      font-family: var(--font-pixel);
      font-size: 7px;
      padding: 14px 20px;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      color: var(--muted);
      cursor: pointer;
      transition: 0.2s;
      white-space: nowrap;
    }

    .set-nav__tab:hover { color: #aaa; }
    .set-nav__tab--active { color: var(--gold); border-bottom-color: var(--gold); }

    .set-nav__dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      margin-right: 7px;
      vertical-align: middle;
    }

    /* ============================================================
       TOOLBAR (export / import / reset)
    ============================================================ */
    .toolbar {
      padding: 10px 32px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      background: rgba(0,0,0,0.15);
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }

    .toolbar__btn {
      font-family: var(--font-pixel);
      font-size: 6px;
      padding: 7px 12px;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.2s;
      border: 1px solid;
      white-space: nowrap;
    }

    .toolbar__btn--export  { background: rgba(0,232,154,0.07);  border-color: rgba(0,232,154,0.3);  color: var(--green); }
    .toolbar__btn--export:hover  { background: rgba(0,232,154,0.15); }
    .toolbar__btn--import  { background: rgba(74,158,255,0.07);  border-color: rgba(74,158,255,0.3);  color: var(--blue); }
    .toolbar__btn--import:hover  { background: rgba(74,158,255,0.15); }
    .toolbar__btn--reset   { background: rgba(255,80,80,0.07);   border-color: rgba(255,80,80,0.3);   color: #ff5555; }
    .toolbar__btn--reset:hover   { background: rgba(255,80,80,0.15); }

    .toolbar__hint {
      font-family: var(--font-pixel);
      font-size: 5px;
      color: #333;
      margin-left: 4px;
    }

    /* ============================================================
       FILTER BAR (search + filters + progress)
    ============================================================ */
    .filter-bar {
      padding: 14px 32px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      background: rgba(0,0,0,0.2);
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }

    .filter-bar__search {
      flex: 1;
      min-width: 160px;
      max-width: 260px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 5px;
      font-size: 12px;
      outline: none;
      transition: 0.2s;
    }

    .filter-bar__search:focus { border-color: var(--gold); }

    .filter-bar__btn {
      font-family: var(--font-pixel);
      font-size: 6px;
      padding: 8px 12px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--muted);
      cursor: pointer;
      border-radius: 5px;
      transition: 0.2s;
    }

    .filter-bar__btn--active {
      color: var(--gold);
      border-color: rgba(245,197,24,0.4);
      background: rgba(245,197,24,0.06);
    }

    /* ============================================================
       PROGRESS BAR
    ============================================================ */
    .progress {
      flex: 1;
      min-width: 160px;
    }

    .progress__labels {
      display: flex;
      justify-content: space-between;
      font-family: var(--font-pixel);
      font-size: 6px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .progress__pct { color: var(--green); }

    .progress__bar {
      height: 6px;
      background: rgba(255,255,255,0.06);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress__fill {
      height: 100%;
      background: linear-gradient(90deg, var(--green), #00ffbb);
      border-radius: 3px;
      transition: width 0.4s ease;
      box-shadow: 0 0 8px rgba(0,232,154,0.3);
    }

    /* ============================================================
       MAIN CONTENT
    ============================================================ */
    .main { padding: 24px 32px; }

    .set-header {
      margin-bottom: 18px;
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .set-header__name {
      font-family: var(--font-pixel);
      font-size: 13px;
      color: var(--gold);
    }

    .set-header__jp {
      font-size: 20px;
      color: rgba(255,255,255,0.18);
      font-weight: 700;
    }

    /* ============================================================
       RARITY SECTION DIVIDER
    ============================================================ */
    .rarity-divider {
      font-family: var(--font-pixel);
      font-size: 7px;
      color: var(--muted);
      padding: 12px 0 8px;
      letter-spacing: 2px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .rarity-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.04);
    }

    .rarity-divider__count { color: var(--gold); }

    /* ============================================================
       CARDS GRID
    ============================================================ */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 8px;
      margin-bottom: 6px;
    }

    /* ============================================================
       CARD
    ============================================================ */
    .card {
      background: linear-gradient(150deg, var(--bg-card), #100e20);
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 8px;
      cursor: pointer;
      transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s;
      position: relative;
      overflow: hidden;
      user-select: none;
    }

    .card:hover {
      transform: translateY(-3px) scale(1.025);
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      border-color: rgba(245,197,24,0.3);
      z-index: 2;
    }

    /* Owned card */
    .card--owned {
      border-color: rgba(0,232,154,0.55);
      background: linear-gradient(150deg, var(--bg-card-own), #0c1c18);
    }

    .card--owned::after {
      content: '✓';
      position: absolute;
      top: 5px;
      right: 7px;
      color: var(--green);
      font-size: 13px;
      font-weight: bold;
      text-shadow: 0 0 6px rgba(0,232,154,0.5);
    }

    /* Holo card — animated shimmer */
    .card--holo::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent 30%, rgba(180,140,255,0.06) 50%, transparent 70%);
      background-size: 200% 200%;
      animation: holo-sweep 5s ease infinite;
      border-radius: 10px;
      pointer-events: none;
    }

    @keyframes holo-sweep {
      0%   { background-position: 0% 0%; }
      50%  { background-position: 100% 100%; }
      100% { background-position: 0% 0%; }
    }

    .card--holo  { border-color: rgba(180,140,255,0.25); }
    .card--holo.card--owned { border-color: rgba(0,232,154,0.6); }

    /* ============================================================
       SPRITE ZONE
    ============================================================ */
    .card__sprite-zone {
      width: 100%;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.35);
      border-radius: 6px;
      margin-bottom: 6px;
      position: relative;
      overflow: hidden;
    }

    /* CRT scanlines */
    .card__sprite-zone::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        rgba(0,0,0,0.12) 3px,
        rgba(0,0,0,0.12) 4px
      );
      pointer-events: none;
      z-index: 2;
    }

    .card__sprite {
      width: 68px;
      height: 68px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      position: relative;
      z-index: 1;
      transition: transform 0.2s;
    }

    /* Item sprites: smaller size, smooth rendering */
    .card__sprite--item {
      width: 40px;
      height: 40px;
      image-rendering: auto;
    }

    /* Silhouette when not owned */
    .card:not(.card--owned) .card__sprite { filter: brightness(0); opacity: 0.15; }
    /* Full color + glow when owned */
    .card--owned .card__sprite { filter: contrast(1.1) drop-shadow(0 0 5px rgba(0,232,154,0.3)); }
    /* Owned items: golden glow instead of green */
    .card--owned .card__sprite--item { filter: contrast(1.1) drop-shadow(0 0 6px rgba(255,200,50,0.6)); }
    .card:hover .card__sprite { transform: scale(1.1); }

    .card__sprite-fallback {
      font-size: 26px;
      opacity: 0.2;
      z-index: 1;
    }

    /* ============================================================
       CARD TEXT
    ============================================================ */
    .card__number {
      font-family: var(--font-pixel);
      font-size: 5px;
      color: rgba(255,255,255,0.2);
      margin-bottom: 3px;
    }

    .card__name {
      font-size: 11px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
      margin-bottom: 1px;
    }

    .card__name-sub { font-size: 9px; color: var(--muted); }

    /* Shimmer effect on holo card names */
    .card--holo .card__name {
      background: linear-gradient(90deg, #ccc 20%, var(--purple) 50%, #ccc 80%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 3s linear infinite;
    }

    .card--holo.card--owned .card__name {
      background: linear-gradient(90deg, #00ffaa, #a0d0ff 50%, #00ffaa);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 2s linear infinite;
    }

    @keyframes shimmer { to { background-position: 200% center; } }

    .card__footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 5px;
    }

    /* Rarity pip */
    .card__rarity-pip {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    .card--holo     .card__rarity-pip { background: var(--purple); box-shadow: 0 0 5px rgba(200,160,255,0.6); }
    .card--rare     .card__rarity-pip { background: var(--gold);   box-shadow: 0 0 4px rgba(245,197,24,0.5); }
    .card--uncommon .card__rarity-pip { background: var(--blue);   box-shadow: 0 0 4px rgba(74,158,255,0.4); }
    .card--common   .card__rarity-pip { background: #444; }

    .card__type { font-size: 12px; }

    /* ============================================================
       TOAST NOTIFICATION
    ============================================================ */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1a2820;
      border: 1px solid var(--green);
      color: var(--green);
      font-family: var(--font-pixel);
      font-size: 7px;
      padding: 11px 16px;
      border-radius: 6px;
      z-index: 9999;
      transform: translateY(70px);
      opacity: 0;
      transition: 0.25s;
      pointer-events: none;
    }

    .toast--visible { transform: translateY(0); opacity: 1; }

    /* ============================================================
       MODAL (export JSON + confirm)
    ============================================================ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal {
      background: #131126;
      border: 2px solid var(--green);
      border-radius: 10px;
      padding: 20px;
      width: 100%;
      max-width: 500px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal--danger { border-color: #ff5555; }

    .modal__title {
      font-family: var(--font-pixel);
      font-size: 8px;
      color: var(--green);
    }

    .modal--danger .modal__title { color: #ff5555; }

    .modal__hint {
      font-family: var(--font-pixel);
      font-size: 6px;
      color: var(--muted);
      line-height: 2;
    }

    .modal__textarea {
      flex: 1;
      min-height: 200px;
      background: var(--bg);
      border: 1px solid #333;
      color: var(--green);
      font-family: monospace;
      font-size: 10px;
      padding: 10px;
      border-radius: 6px;
      resize: none;
      outline: none;
    }

    .modal__actions { display: flex; gap: 8px; }

    .modal__btn {
      font-family: var(--font-pixel);
      font-size: 6px;
      padding: 9px 14px;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.2s;
    }

    .modal__btn--confirm { background: rgba(0,232,154,0.1);  border: 1px solid var(--green); color: var(--green); }
    .modal__btn--danger  { background: rgba(255,80,80,0.1);  border: 1px solid #ff5555;      color: #ff5555; }
    .modal__btn--cancel  { background: rgba(255,255,255,0.04); border: 1px solid #444;        color: #888; }

    /* ============================================================
       UTILITIES
    ============================================================ */
    .hidden { display: none !important; }

    @media (max-width: 600px) {
      .header, .set-nav, .toolbar, .filter-bar, .main { padding-left: 14px; padding-right: 14px; }
      .cards-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
      .stats { gap: 6px; }
    }
  </style>
</head>
<body>

  <!-- ============================================================
       HEADER
  ============================================================ -->
  <header class="header">
    <div class="header__logo">
      <img
        class="header__pokeball"
        src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png"
        alt="Poké Ball"
        width="38"
        height="38"
      />
      <span class="header__logo-text">
        PokeCollection
        <small id="header-subtitle">TRACKER — EDITION JAPONAISE</small>
      </span>
    </div>

    <div class="header__right">
      <!-- Sélecteur de langue -->
      <div class="lang-switch">
        <button class="lang-switch__btn" data-lang="jp" onclick="setLanguage('jp')">JP</button>
        <button class="lang-switch__btn lang-switch__btn--active" data-lang="fr" onclick="setLanguage('fr')">FR</button>
        <button class="lang-switch__btn" data-lang="en" onclick="setLanguage('en')">EN</button>
      </div>

      <!-- Stats globales -->
      <div class="stats">
        <div class="stats__item">
          <span class="stats__value" id="stat-owned">0</span>
          <span class="stats__label" id="stat-owned-lbl">POSSÉDÉES</span>
        </div>
        <div class="stats__item">
          <span class="stats__value" id="stat-total">0</span>
          <span class="stats__label" id="stat-total-lbl">TOTAL</span>
        </div>
        <div class="stats__item">
          <span class="stats__value" id="stat-pct" style="color: var(--green)">0%</span>
          <span class="stats__label" id="stat-pct-lbl">COMPLET</span>
        </div>
      </div>
    </div>
  </header>

  <!-- ============================================================
       SET NAVIGATION
  ============================================================ -->
  <nav class="set-nav">
    <button class="set-nav__tab set-nav__tab--active" data-set="base"   onclick="selectSet('base')">
      <span class="set-nav__dot" style="background:#e53935"></span><span id="tab-base">SET DE BASE</span>
    </button>
    <button class="set-nav__tab" data-set="jungle" onclick="selectSet('jungle')">
      <span class="set-nav__dot" style="background:#43a047"></span><span id="tab-jungle">JUNGLE</span>
    </button>
    <button class="set-nav__tab" data-set="fossil" onclick="selectSet('fossil')">
      <span class="set-nav__dot" style="background:#c89020"></span><span id="tab-fossil">FOSSIL</span>
    </button>
    <button class="set-nav__tab" data-set="rocket" onclick="selectSet('rocket')">
      <span class="set-nav__dot" style="background:#7986cb"></span><span id="tab-rocket">ROCKET</span>
    </button>
  </nav>

  <!-- ============================================================
       TOOLBAR (sauvegarde)
  ============================================================ -->
  <div class="toolbar">
    <button class="toolbar__btn toolbar__btn--export" onclick="exportCollection()">💾 <span id="btn-export">EXPORTER</span></button>
    <button class="toolbar__btn toolbar__btn--import" onclick="document.getElementById('import-input').click()">📂 <span id="btn-import">IMPORTER</span></button>
    <button class="toolbar__btn toolbar__btn--reset"  onclick="confirmReset()">🗑 <span id="btn-reset">RESET</span></button>
    <input type="file" id="import-input" accept=".json" style="display:none" onchange="importCollection(event)" />
    <span class="toolbar__hint">← sauvegarde / restaure ta collection</span>
  </div>

  <!-- ============================================================
       FILTER BAR
  ============================================================ -->
  <div class="filter-bar">
    <input
      type="text"
      id="search-input"
      class="filter-bar__search"
      placeholder="🔍 Rechercher..."
      oninput="applyFilters()"
    />
    <button class="filter-bar__btn filter-bar__btn--active" id="filter-all"     onclick="setFilter('all')">TOUTES</button>
    <button class="filter-bar__btn"                         id="filter-owned"   onclick="setFilter('owned')">✓ POSSÉDÉES</button>
    <button class="filter-bar__btn"                         id="filter-missing" onclick="setFilter('missing')">✗ MANQUANTES</button>

    <div class="progress">
      <div class="progress__labels">
        <span id="progress-text">0 / 0</span>
        <span class="progress__pct" id="progress-pct">0%</span>
      </div>
      <div class="progress__bar">
        <div class="progress__fill" id="progress-fill" style="width: 0%"></div>
      </div>
    </div>
  </div>

  <!-- ============================================================
       CARDS
  ============================================================ -->
  <main class="main" id="cards-container"></main>

  <!-- Toast notification -->
  <div class="toast" id="toast"></div>

    /* ============================================================
       STATE — données dynamiques
    ============================================================ */

    /** Collection: key "set|number" → true if owned */
    let collection = {};

    /** Currently displayed set */
    let currentSet = 'base';

    /** Active filter: 'all' | 'owned' | 'missing' */
    let currentFilter = 'all';

    /** Active language: 'fr' | 'en' | 'jp' */
    let currentLang = 'fr';

    /** localStorage key */
    const STORAGE_KEY = 'pkm-collection-v1';


    /* ============================================================
       PERSISTANCE
    ============================================================ */

    function loadCollection() {
      try {
        collection = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      } catch {
        collection = {};
      }
    }

    function saveCollection() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(collection));
      } catch (e) {
        showToast('⚠️ Impossible de sauvegarder');
      }
    }


    /* ============================================================
       HELPERS
    ============================================================ */

    /** Generates the unique key for a card */
    const cardKey = (setId, cardNumber) => `${setId}|${cardNumber}`;

    /** Returns the card name in the current language */
    const getCardName = (card) => card[currentLang];

    /** Returns the secondary name (reference language) */
    const getCardSubName = (card) => currentLang === 'jp' ? card.en : card.jp;

    /** Returns all names of a card (for multilingual search) */
    const getAllCardNames = (card) => `${card.jp} ${card.fr} ${card.en}`.toLowerCase();

    /** Counts owned cards in a set */
    const countOwned = (setId) =>
      SETS[setId].cards.filter(c => collection[cardKey(setId, c.n)]).length;


    /* ============================================================
       RENDU DES CARTES
    ============================================================ */

    function renderSet(setId) {
      const set = SETS[setId];
      const rarityOrder = ['holo', 'rare', 'uncommon', 'common'];

      // Group cards by rarity
      const groups = {};
      rarityOrder.forEach(r => { groups[r] = []; });
      set.cards.forEach(card => groups[card.r]?.push(card));

      let html = `
        <div class="set-header">
          <span class="set-header__name">${set.name[currentLang]}</span>
          <span class="set-header__jp">${set.subtitle}</span>
        </div>
      `;

      rarityOrder.forEach(rarity => {
        const cards = groups[rarity];
        if (!cards.length) return;

        html += `
          <div class="rarity-divider" data-rarity="${rarity}">
            ${RARITY_LABELS[currentLang][rarity]}
            <span class="rarity-divider__count">(${cards.length})</span>
          </div>
          <div class="cards-grid">
            ${cards.map(card => renderCard(setId, card)).join('')}
          </div>
        `;
      });

      document.getElementById('cards-container').innerHTML = html;
    }

    function renderCard(setId, card) {
      const key     = cardKey(setId, card.n);
      const isOwned = !!collection[key];
      const classes = [
        'card',
        `card--${card.r}`,
        isOwned ? 'card--owned' : '',
      ].filter(Boolean).join(' ');

      const spriteHtml = card.d
        ? `<img
              class="card__sprite"
              src="${getSpriteUrl(card.d)}"
              alt="${card.en}"
              loading="lazy"
              width="68"
              height="68"
              onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'"
           />
           <span class="card__sprite-fallback" style="display:none">${card.t}</span>`
        : card.item
        ? `<img
              class="card__sprite card__sprite--item"
              src="${getItemSpriteUrl(card.item)}"
              alt="${card.en}"
              loading="lazy"
              width="40"
              height="40"
              onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'"
           />
           <span class="card__sprite-fallback" style="display:none">${card.t}</span>`
        : `<span class="card__sprite-fallback">${card.t}</span>`;

      return `
        <div
          class="${classes}"
          data-key="${key}"
          data-names="${getAllCardNames(card)}"
          data-owned="${isOwned}"
          onclick="toggleCard('${setId}', '${card.n}')"
        >
          <div class="card__number">${setId.toUpperCase()} #${card.n}</div>
          <div class="card__sprite-zone">${spriteHtml}</div>
          <div class="card__name">${getCardName(card)}</div>
          <div class="card__name-sub">${getCardSubName(card)}</div>
          <div class="card__footer">
            <div class="card__rarity-pip"></div>
            <span class="card__type">${card.t}</span>
          </div>
        </div>
      `;
    }


    /* ============================================================
       INTERACTIONS CARTES
    ============================================================ */

    function toggleCard(setId, cardNumber) {
      const key = cardKey(setId, cardNumber);
      collection[key] = !collection[key];
      saveCollection();

      // DOM update without full re-render
      const el = document.querySelector(`[data-key="${key}"]`);
      if (el) {
        const isOwned = collection[key];
        el.classList.toggle('card--owned', isOwned);
        el.dataset.owned = isOwned;
      }

      updateStats();
      applyFilters();
      showToast(collection[key] ? '✓ Carte ajoutée !' : '✗ Carte retirée');
    }


    /* ============================================================
       STATS
    ============================================================ */

    function updateStats() {
      // Current set stats (progress bar)
      const setCards  = SETS[currentSet].cards;
      const setTotal  = setCards.length;
      const setOwned  = countOwned(currentSet);
      const setPct    = setTotal ? Math.round(setOwned / setTotal * 100) : 0;

      document.getElementById('progress-text').textContent = `${setOwned} / ${setTotal}`;
      document.getElementById('progress-pct').textContent  = `${setPct}%`;
      document.getElementById('progress-fill').style.width = `${setPct}%`;

      // Global stats (header)
      let globalTotal = 0;
      let globalOwned = 0;
      Object.keys(SETS).forEach(setId => {
        globalTotal += SETS[setId].cards.length;
        globalOwned += countOwned(setId);
      });
      const globalPct = globalTotal ? Math.round(globalOwned / globalTotal * 100) : 0;

      document.getElementById('stat-owned').textContent = globalOwned;
      document.getElementById('stat-total').textContent = globalTotal;
      document.getElementById('stat-pct').textContent   = `${globalPct}%`;
    }


    /* ============================================================
       FILTRES & RECHERCHE
    ============================================================ */

    function applyFilters() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();

      document.querySelectorAll('.card').forEach(el => {
        const matchesSearch = !query || el.dataset.names.includes(query);
        const matchesFilter =
          currentFilter === 'all'    ||
          (currentFilter === 'owned'   && el.dataset.owned === 'true') ||
          (currentFilter === 'missing' && el.dataset.owned === 'false');

        el.classList.toggle('hidden', !(matchesSearch && matchesFilter));
      });
    }

    function setFilter(filter) {
      currentFilter = filter;

      // Update button visual state
      ['all', 'owned', 'missing'].forEach(f => {
        document.getElementById(`filter-${f}`)
          .classList.toggle('filter-bar__btn--active', f === filter);
      });

      applyFilters();
    }


    /* ============================================================
       NAVIGATION ENTRE SETS
    ============================================================ */

    function selectSet(setId) {
      currentSet = setId;

      // Update tabs
      document.querySelectorAll('.set-nav__tab').forEach(tab => {
        tab.classList.toggle('set-nav__tab--active', tab.dataset.set === setId);
      });

      renderSet(setId);
      updateStats();
      applyFilters();
    }


    /* ============================================================
       LANGUE
    ============================================================ */

    function setLanguage(lang) {
      currentLang = lang;

      // Update language buttons
      document.querySelectorAll('.lang-switch__btn').forEach(btn => {
        btn.classList.toggle('lang-switch__btn--active', btn.dataset.lang === lang);
      });

      // Update UI labels
      const labels = UI_LABELS[lang];
      document.getElementById('stat-owned-lbl').textContent  = labels.owned;
      document.getElementById('stat-total-lbl').textContent  = labels.total;
      document.getElementById('stat-pct-lbl').textContent    = labels.complete;
      document.getElementById('filter-all').textContent      = labels.all;
      document.getElementById('filter-owned').textContent    = labels.yes;
      document.getElementById('filter-missing').textContent  = labels.no;
      document.getElementById('search-input').placeholder    = labels.search;

      // Header title
      document.getElementById('header-subtitle').textContent = labels.subtitle;

      // Toolbar buttons
      document.getElementById('btn-export').textContent = labels.export;
      document.getElementById('btn-import').textContent = labels.import;
      document.getElementById('btn-reset').textContent  = labels.reset;

      // Set tab names
      Object.keys(SETS).forEach(setId => {
        const el = document.getElementById(`tab-${setId}`);
        if (el) el.textContent = SETS[setId].name[lang];
      });

      // Rarity labels
      document.querySelectorAll('.rarity-divider').forEach(el => {
        const rarity = el.dataset.rarity;
        if (rarity) {
          const countEl = el.querySelector('.rarity-divider__count');
          const countText = countEl ? countEl.outerHTML : '';
          el.innerHTML = RARITY_LABELS[lang][rarity] + ' ' + countText;
        }
      });

      // Update card names without full re-render
      document.querySelectorAll('.card').forEach(el => {
        const [setId, cardNum] = el.dataset.key.split('|');
        const card = SETS[setId]?.cards.find(c => c.n === cardNum);
        if (!card) return;
        el.querySelector('.card__name').textContent     = getCardName(card);
        el.querySelector('.card__name-sub').textContent = getCardSubName(card);
      });

      applyFilters();
    }


    /* ============================================================
       EXPORT / IMPORT / RESET
    ============================================================ */

    function exportCollection() {
      const labels    = UI_LABELS[currentLang];
      const ownedKeys = Object.keys(collection).filter(k => collection[k]);

      if (ownedKeys.length === 0) {
        showToast(labels.noCards);
        return;
      }

      const exportData = {
        version:    1,
        date:       new Date().toISOString().slice(0, 10),
        collection: collection,
      };
      const json = JSON.stringify(exportData, null, 2);
      const uri  = 'data:application/json;charset=utf-8,' + encodeURIComponent(json);
      const link = document.createElement('a');
      link.href     = uri;
      link.download = `pokemon-collection-${exportData.date}.json`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      showToast(`💾 ${ownedKeys.length} ${labels.imported}`);
    }

    function importCollection(event) {
      const labels = UI_LABELS[currentLang];
      const file   = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();

      reader.onload = (e) => {
        try {
          const parsed   = JSON.parse(e.target.result);
          const imported = (parsed?.collection && typeof parsed.collection === 'object')
            ? parsed.collection
            : parsed;

          if (typeof imported !== 'object' || Array.isArray(imported)) {
            throw new Error('Format invalide');
          }

          const count = Object.keys(imported).filter(k => imported[k]).length;
          Object.assign(collection, imported);
          saveCollection();
          selectSet(currentSet);
          showToast(`📂 ${count} ${labels.imported}`);

        } catch {
          showToast('❌ Fichier invalide');
        }

        event.target.value = '';
      };

      reader.onerror = () => showToast('❌ Impossible de lire le fichier');
      reader.readAsText(file);
    }

    function confirmReset() {
      const labels     = UI_LABELS[currentLang];
      const ownedCount = Object.keys(collection).filter(k => collection[k]).length;

      if (ownedCount === 0) {
        showToast(labels.alreadyEmpty);
        return;
      }

      const modal = createModal({
        title:   `⚠️ ${labels.resetTitle} ${ownedCount} ${labels.resetCards}`,
        hint:    labels.resetHint,
        danger:  true,
        actions: `
          <button class="modal__btn modal__btn--danger" onclick="resetCollection()">${labels.resetYes}</button>
          <button class="modal__btn modal__btn--cancel" onclick="closeModal()">${labels.resetNo}</button>
        `,
      });

      document.body.appendChild(modal);
    }

    function resetCollection() {
      const labels = UI_LABELS[currentLang];
      collection   = {};
      saveCollection();
      closeModal();
      selectSet(currentSet);
      showToast(labels.resetDone);
    }

    /* ============================================================
       UI HELPERS — MODAL & TOAST
    ============================================================ */

    /**
     * Creates an overlay modal.
     * @param {{ title, hint, content, actions, danger }} options
     */
    function createModal({ title, hint = '', content = '', actions, danger = false }) {
      closeModal(); // close any already-open modal

      const overlay = document.createElement('div');
      overlay.className  = 'modal-overlay';
      overlay.id         = 'modal-overlay';

      // Click outside = close
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) closeModal();
      });

      overlay.innerHTML = `
        <div class="modal ${danger ? 'modal--danger' : ''}">
          <div class="modal__title">${title}</div>
          ${hint ? `<div class="modal__hint">${hint}</div>` : ''}
          ${content}
          <div class="modal__actions">${actions}</div>
        </div>
      `;

      return overlay;
    }

    function closeModal() {
      document.getElementById('modal-overlay')?.remove();
    }

    /** Shows a temporary toast notification */
    let toastTimer = null;

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('toast--visible');

      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('toast--visible'), 2500);
    }


    /* ============================================================
       INITIALISATION
    ============================================================ */

    loadCollection();
    selectSet('base');

    // Load Poké Ball sprite as favicon via canvas (bypasses external URL restriction)
    (function() {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = function() {
        const canvas  = document.createElement('canvas');
        canvas.width  = 32;
        canvas.height = 32;
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(img, 0, 0, 32, 32);
        document.getElementById('favicon').href = canvas.toDataURL('image/png');
      };
      img.src = 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png';
    })();
  </script>
</body>
</html>
